name: Build ANGLE

on:
  push:
    banches: [ main ]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no new commits'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - name: Check for new ANGLE commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 获取 angle/angle 仓库 main 分支的最新 commit hash
          LATEST_COMMIT=$(git ls-remote https://chromium.googlesource.com/angle/angle.git refs/heads/main | awk '{print $1}')
          echo "commit=$LATEST_COMMIT" | tee -a $GITHUB_OUTPUT

          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          if [[ "$FORCE_BUILD" == "true" ]]; then
            echo "skip=false" | tee -a $GITHUB_OUTPUT
            exit 0
          fi

          # 获取上一次 nightly release 中记录的 commit hash
          PREV_COMMIT="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body -q .body | sed -n 's/^Commit: \[\(.*\)\].*/\1/p')"
          echo "prev_commit=$PREV_COMMIT" | tee -a $GITHUB_OUTPUT

          # 如果 commit 没有变化，则跳过构建
          if [[ "$LATEST_COMMIT" == "$PREV_COMMIT" ]]; then
            echo "skip=true" | tee -a $GITHUB_OUTPUT
          else
            echo "skip=false" | tee -a $GITHUB_OUTPUT
          fi

  build-angle:
    needs: check-updates
    if: needs.check-updates.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DEPOT_TOOLS_PATH: ${{ github.workspace }}/depot_tools
      ANGLE_ROOT: ${{ github.workspace }}/angle
      LATEST_COMMIT: ${{ needs.check-updates.outputs.commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 python3-pip \
            openjdk-17-jdk-headless \
            ninja-build

      - name: Set JDK environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Cache depot_tools
        id: cache-depot-tools
        uses: actions/cache@v6
        with:
          path: ${{ env.DEPOT_TOOLS_PATH }}
          key: depot-tools-${{ runner.os }}-v1
          restore-keys: |
            depot-tools-${{ runner.os }}-

      - name: Fetch depot_tools
        if: steps.cache-depot-tools.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$DEPOT_TOOLS_PATH"

      - name: Ensure depot_tools in PATH
        run: echo "$DEPOT_TOOLS_PATH" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Fetch ANGLE source
        run: |
          mkdir -p "$ANGLE_ROOT"
          cd "$ANGLE_ROOT"

          cat > .gclient << 'EOF'
          solutions = [
            {
              "name": ".",
              "url": "https://chromium.googlesource.com/angle/angle.git@refs/heads/main",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ['android']
          EOF

          gclient sync --no-history

      - name: Generate GN build files
        run: |
          cd "$ANGLE_ROOT"
          gn gen out/Android --args='
            target_os = "android"
            target_cpu = "arm64"
            is_component_build = false
            is_debug = false
            arm_control_flow_integrity = "none"
            use_rtti = false
            use_thin_lto = true
            thin_lto_enable_optimizations = true
            use_lld = true
            angle_enable_vulkan = true
            angle_enable_gl = false
            angle_enable_vulkan_validation_layers = false
            angle_enable_vulkan_api_dump_layer = false
            angle_assert_always_on = false
            dcheck_always_on = false
            angle_enable_trace = false
            angle_enable_trace_events = false
            angle_enable_trace_android_logcat = false
            angle_enable_platform_trace_events = false
            angle_always_log_info = false
            angle_enable_annotator_run_time_checks = false
            angle_build_all = false
            enable_resource_allowlist_generation = false
            symbol_level = 0
            strip_debug_info = true
            use_goma = false
            use_remoteexec = false
          '

      - name: Build ANGLE APK
        run: |
          cd "$ANGLE_ROOT"
          autoninja -C out/Android angle_apks

      - name: Package Module and Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 解压指定的 so 文件到 module/system/lib64/
          7z e \
            -omodule/system/lib64/ \
            "$ANGLE_ROOT/out/Android/apks/AngleLibraries.apk" \
            "lib/arm64-v8a/libEGL_angle.so" \
            "lib/arm64-v8a/libGLESv1_CM_angle.so" \
            "lib/arm64-v8a/libGLESv2_angle.so"

          # 提取 ANGLE 版本号
          MAJOR=$(grep "ANGLE_MAJOR_VERSION" "$ANGLE_ROOT/src/common/angle_version.h" | awk '{print $3}' | head -n 1)
          MINOR=$(grep "ANGLE_MINOR_VERSION" "$ANGLE_ROOT/src/common/angle_version.h" | awk '{print $3}' | head -n 1)

          MAJOR=${MAJOR:-2}
          MINOR=${MINOR:-1}
          PATCH=1

          ANGLE_VERSION="$(TZ=Asia/Shanghai date "+%F %T") (ANGLE ${MAJOR}.${MINOR}.${PATCH} git hash: ${LATEST_COMMIT:0:12})"
          TIMESTAMP="$(date +%s)"

          echo "version=${ANGLE_VERSION}" >> module/module.prop
          echo "versionCode=${TIMESTAMP}" >> module/module.prop

          cd module
          7z -mm=xz -mx=9 a ../AngleLibraries.zip
          cd ..

          # 发布到 releases 的 nightly 通道
          gh release delete nightly -y --cleanup-tag || true
          gh release create nightly AngleLibraries.zip "$ANGLE_ROOT/out/Android/apks/AngleLibraries.apk" \
            --title "Nightly Build" \
            --notes "Commit: [${LATEST_COMMIT}](https://chromium.googlesource.com/angle/angle/+/${LATEST_COMMIT})
          Version: ${ANGLE_VERSION}
          Timestamp: ${TIMESTAMP}"

      - name: Upload ANGLE APK
        uses: actions/upload-artifact@v7
        with:
          name: angle-apk
          path: ${{ env.ANGLE_ROOT }}/out/Android/apks/AngleLibraries.apk
          if-no-files-found: error

      - name: Upload Module Zip
        uses: actions/upload-artifact@v7
        with:
          name: angle-module
          path: AngleLibraries.zip
          if-no-files-found: error
